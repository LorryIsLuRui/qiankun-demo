name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # #########################################################
  # 1. 检测哪些 package 发生变化
  # #########################################################
  detect:
    runs-on: ubuntu-latest
    outputs:
      main_changed: ${{ steps.diff.outputs.main }}
      shop_changed: ${{ steps.diff.outputs.shop }}
      utils_changed: ${{ steps.diff.outputs.utils }}
      components_changed: ${{ steps.diff.outputs.components }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史以进行 diff 比较

      - name: Detect changed packages
        id: diff
        run: |
          echo "Event before: ${{ github.event.before }}"
          echo "Event head:   ${{ github.sha }}"
          git --no-pager log -n 5 --pretty=oneline
          echo "main=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^packages/main/' | wc -l)" >> $GITHUB_OUTPUT
          echo "shop=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^packages/shop/' | wc -l)" >> $GITHUB_OUTPUT
          echo "utils=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^packages/utils/' | wc -l)" >> $GITHUB_OUTPUT
          echo "components=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^packages/components/' | wc -l)" >> $GITHUB_OUTPUT

          echo "==== Changed Result ===="
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true
          echo "main: $(grep '^packages/main/' -c <<< $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}))"
          echo "shop: $(grep '^packages/shop/' -c <<< $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}))"
          echo "utils: $(grep '^packages/utils/' -c <<< $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}))"
          echo "components: $(grep '^packages/components/' -c <<< $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}))"


  # #########################################################
  # 2. 编译 & 部署（matrix 按需执行）
  # #########################################################
  build_and_deploy:
    needs: detect
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [main, shop, utils, components]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史以进行 diff 比较

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # ---------------- SSH 配置 ----------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      # ---------------- BUILD ----------------
      - name: Build changed package
        if: |
          (matrix.package == 'main' && needs.detect.outputs.main_changed != '0') ||
          (matrix.package == 'shop' && needs.detect.outputs.shop_changed != '0') ||
          (matrix.package == 'utils' && needs.detect.outputs.utils_changed != '0') ||
          (matrix.package == 'components' && needs.detect.outputs.components_changed != '0')
        run: npm run build --workspace=packages/${{ matrix.package }}

      # ---------------- DEPLOY（rsync） ----------------
      - name: Deploy to server
        if: |
          (matrix.package == 'main' && needs.detect.outputs.main_changed != '0') ||
          (matrix.package == 'shop' && needs.detect.outputs.shop_changed != '0') ||
          (matrix.package == 'utils' && needs.detect.outputs.utils_changed != '0') ||
          (matrix.package == 'components' && needs.detect.outputs.components_changed != '0')
        run: |
          echo "Deploying ${{ matrix.package }} ..."
          rsync -avz --delete \
            packages/${{ matrix.package }}/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{secrets.REMOTE_BASE}}/${{ matrix.package }}/

      - name: Deployment complete
        if: |
          (matrix.package == 'main' && needs.detect.outputs.main_changed != '0') ||
          (matrix.package == 'shop' && needs.detect.outputs.shop_changed != '0') ||
          (matrix.package == 'utils' && needs.detect.outputs.utils_changed != '0') ||
          (matrix.package == 'components' && needs.detect.outputs.components_changed != '0')
        run: echo "🚀 Finished deploying ${{ matrix.package }}"


